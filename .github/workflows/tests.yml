name: SmokeTests

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke_tests:
    name: Smoke tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs the history to determine the version.
        fetch-depth: 0

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install
      run: python -m pip install -v . pytest

    - name: Run tests
      # Run from outside the source tree so the installed package is imported.
      working-directory: ${{ runner.temp }}
      run: python -m pytest ${{ github.workspace }}/tests -v --durations=10
